<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Timeline</title>
    <!-- Links to your CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Links to your JS file (defer makes sure it loads after HTML) -->
    <script src="script.js" defer></script>
</head>
<body>

    <div id="app-status" class="app-status" role="status" aria-live="polite">
        <div class="app-status-panel">
            <span class="app-status-message">Loading timeline…</span>
            <button class="app-status-retry" type="button" hidden>Retry</button>
        </div>
    </div>

    <div id="viewport">
        <div id="grid-track" aria-hidden="true">
            <div id="annual-grid-layer" class="grid-layer"></div>
            <div id="decade-grid-layer" class="grid-layer"></div>
            <div id="half-century-grid-layer" class="grid-layer"></div>
            <div id="century-grid-layer" class="grid-layer"></div>
        </div>
        <div id="track">
            <div id="center-line"></div>
            <!-- JavaScript will inject items here -->
        </div>
    </div>

</body>
</html>
